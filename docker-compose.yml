version: '3.9'

# ═══════════════════════════════════════════════════════════════
#  E-Commerce Platform - Docker Compose (Local Dev)
#  Run: docker-compose up -d
#  Stop: docker-compose down -v
# ═══════════════════════════════════════════════════════════════

networks:
  ecommerce-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql-data:
  redis-data:
  elasticsearch-data:
  mongodb-data:
  kafka-data:
  zookeeper-data:

# ─────────────────────────────────────────────
# ENVIRONMENT DEFAULTS
# ─────────────────────────────────────────────
x-common-env: &common-env
  EUREKA_HOST: service-discovery
  MYSQL_HOST: mysql
  MYSQL_USER: ecommerce
  MYSQL_PASSWORD: 
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  ELASTICSEARCH_HOST: elasticsearch
  MONGODB_HOST: mongodb
  JWT_SECRET: 

x-service-defaults: &service-defaults
  networks:
    - ecommerce-net
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ═══════════════════════════════════
  # INFRASTRUCTURE SERVICES
  # ═══════════════════════════════════

  mysql:
    image: mysql:8.2
    <<: *service-defaults
    container_name: ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: 
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=500
      --innodb_buffer_pool_size=256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    <<: *service-defaults
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    <<: *service-defaults
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    <<: *service-defaults
    container_name: ecommerce-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 
      KAFKA_ADVERTISED_LISTENERS: 
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_MESSAGE_MAX_BYTES: 10485760
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    <<: *service-defaults
    container_name: ecommerce-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    <<: *service-defaults
    container_name: ecommerce-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    <<: *service-defaults
    container_name: ecommerce-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200

  mongodb:
    image: mongo:7.0
    <<: *service-defaults
    container_name: ecommerce-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════
  # SPRING BOOT MICROSERVICES
  # ═══════════════════════════════════

  service-discovery:
    build:
      context: ./service-discovery
      dockerfile: Dockerfile
    <<: *service-defaults
    container_name: ecommerce-eureka
    ports:
      - "8761:8761"
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 45s

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    <<: *service-defaults
    container_name: ecommerce-config
    depends_on:
      service-discovery:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    <<: *service-defaults
    container_name: ecommerce-gateway
    depends_on:
      service-discovery:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    <<: *service-defaults
    container_name: ecommerce-user
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    <<: *service-defaults
    container_name: ecommerce-product
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      <<: *common-env
      SERVER_PORT: 8082
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    <<: *service-defaults
    container_name: ecommerce-cart
    depends_on:
      redis:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      SERVER_PORT: 8083
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    <<: *service-defaults
    container_name: ecommerce-order
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      <<: *common-env
      SERVER_PORT: 8084
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    <<: *service-defaults
    container_name: ecommerce-payment
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      <<: *common-env
      SERVER_PORT: 8085
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    <<: *service-defaults
    container_name: ecommerce-inventory
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      <<: *common-env
      SERVER_PORT: 8086
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    <<: *service-defaults
    container_name: ecommerce-notification
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      service-discovery:
        condition: service_healthy
    ports:
      - "8087:8087"
    environment:
      <<: *common-env
      SERVER_PORT: 8087
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep UP || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    <<: *service-defaults
    container_name: ecommerce-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      - NGINX_HOST=localhost
