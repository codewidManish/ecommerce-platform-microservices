server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configs
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/your-org/ecommerce-config}
          default-label: main
          clone-on-start: true
  security:
    user:
      name: config
      password: config-secret

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:eureka-secret@localhost:8761/eureka/
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,bus-refresh
